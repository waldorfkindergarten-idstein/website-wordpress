services:
  db:
    image: mariadb:11.4
    container_name: waldorf-wp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:-wordpress}
      MARIADB_USER: ${WP_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    # Only PHP and Apache come from this image. WordPress itself is served from
    # the ./wordpress bind mount below, and the entrypoint leaves those files
    # alone once index.php and wp-includes/version.php exist — so the tag never
    # decides the WordPress version. Keep the major in step with the tracked
    # core (7.0.3, matching the STRATO subdomain) and the PHP version pinned.
    image: wordpress:7.0-php8.3-apache
    container_name: waldorf-wp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:${WP_PORT:-8080}' );
        define( 'WP_SITEURL', 'http://localhost:${WP_PORT:-8080}' );
        define( 'FS_METHOD', 'direct' );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    volumes:
      - ./wordpress:/var/www/html

  # WP-CLI, on demand: `docker compose run --rm wpcli option get blog_public`.
  # It shares the same files and database as the web container. Previously the
  # cli was installed by hand into the running container, so every `docker
  # compose up` that recreated it silently took the tool away again.
  wpcli:
    image: wordpress:cli-php8.3
    profiles:
      - cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
    volumes:
      - ./wordpress:/var/www/html
    working_dir: /var/www/html
    user: "33:33"

  adminer:
    image: adminer:4.8.1
    container_name: waldorf-wp-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  db_data:
